
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/assignment_schema
    username: root
    password: root

  application:
    name: docker

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: DEBUG
  file:
    name: /app/logs/app.log


